name: lalink

# =====================================================================
# LALINK — Self-Hosted Deployment
# =====================================================================
# ใช้งาน:
#   1) คัดลอก .env.docker.example ไปเป็น .env  แล้วกรอกค่าให้ครบ
#      cp .env.docker.example .env
#   2) docker compose up -d --build
#   3) เข้าถึงแอปที่ http://localhost:3000
#
# ทุกค่าในไฟล์นี้อ่านจาก .env (ไฟล์เดียวกันกับ docker compose)
# ผ่าน syntax ${VAR:-default} — กรอกค่าใน .env ได้เลย ไม่ต้องแกะไฟล์นี้
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-lalink}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lalink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lalink_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lalink_saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lalink} -d ${POSTGRES_DB:-lalink_saas}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
    image: lalink:latest
    container_name: ${CONTAINER_PREFIX:-lalink}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # --- Database ---
      # ใช้ db service ใน compose เป็นค่า default; เปลี่ยนเป็นภายนอกได้โดย
      # ใส่ DATABASE_URL เต็มใน .env
      DATABASE_URL: postgresql://${POSTGRES_USER:-lalink}:${POSTGRES_PASSWORD:-lalink_secret_change_me}@db:5432/${POSTGRES_DB:-lalink_saas}?schema=public

      # --- App & Auth ---
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lalink_session}

      # --- LINE Integration ---
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}

      # --- S3-Compatible Object Storage ---
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-lalink-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

      # --- Seed (optional) ---
      RUN_SEED: ${RUN_SEED:-false}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@platform.com}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-Admin@123456}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Platform Super Admin}

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
